# ============================================================
# SatQuery-RS — LoRA Fine-Tuning Configuration
# ============================================================
# This config drives train.py for adapting GeoChat-7B → SatQuery-RS
# using BigEarthNet instruction data.
#
# Optimized for: 1x H100 80GB (3 hours per free session)
# Also works on: 1x A100 40/80GB, T4 16GB, L4 24GB
# ============================================================

model:
  base: "MBZUAI/geochat-7B"
  vision_tower: "openai/clip-vit-large-patch14-336"
  trust_remote_code: true

# LoRA adapter configuration
lora:
  r: 64                          # LoRA rank — higher = more capacity
  alpha: 128                     # LoRA alpha — typically 2x rank
  dropout: 0.05                  # LoRA dropout
  target_modules:                # Which layers to adapt
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

# QLoRA quantization (for memory efficiency)
quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

# Training hyperparameters
training:
  epochs: 5
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8    # Effective batch = 4 * 8 = 32
  learning_rate: 2.0e-4             # Original LR for full training
  warmup_ratio: 0.03               # 3% warmup steps
  weight_decay: 0.0
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  max_length: 2048
  bf16: true
  fp16: false
  gradient_checkpointing: true      # Saves VRAM at cost of speed

  # Logging & Evaluation
  logging_steps: 10
  eval_steps: 250                   # Eval every 250 steps → shows eval_loss
  eval_strategy: "steps"

  # Checkpointing — CRITICAL for multi-account training
  save_steps: 250                    # Save every 250 steps
  save_total_limit: 3                # Keep only last 3 checkpoints (disk space)

  # HuggingFace Hub push — checkpoint survival across accounts
  push_to_hub: true
  hub_strategy: "every_save"         # Push every checkpoint to HF
  hub_model_id: "tarunpanthi2006/satquery-rs-vlm" # Push to your repo
  hub_private_repo: true

  # Resume from checkpoint
  resume_from_checkpoint: true       # Auto-resume if checkpoint exists

# Data paths
data:
  train: "datasets/bigearthnet/processed/train.json"
  val: "datasets/bigearthnet/processed/val_small.json"
  # Use debug.json for initial testing:
  # train: "datasets/bigearthnet/processed/debug.json"

# Output
output:
  dir: "models/checkpoints/satquery-rs-vlm"
  logging_dir: "training/finetuning/logs"

# Weights & Biases (optional)
wandb:
  enabled: false
  project: "satquery-rs"
  name: "bigearthnet-lora-v1"
